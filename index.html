<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jean‑François BRUT | Responsable d'Application IS</title>

<style>
:root{
    --primary:#0f172a;
    --secondary:#334155;
    --accent:#2563eb;
    --bg:#f8fafc;
    --card:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Segoe UI", Arial, sans-serif;
    background:var(--bg);
    color:var(--primary);
    line-height:1.6;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

.hero{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:3rem;
    margin-bottom:10px;
}

.hero h2{
    font-weight:400;
    opacity:.9;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:14px 24px;
    border-radius:8px;
    font-weight:600;
    transition:.3s;
}

.btn-primary{
    background:white;
    color:#1e3a8a;
}

.btn-primary:hover{
    transform:translateY(-2px);
}

.btn-secondary{
    border:2px solid white;
    color:white;
}

.btn-secondary:hover{
    background:white;
    color:#1e3a8a;
}

.section{
    padding:60px 0;
}

.section h2{
    text-align:center;
    margin-bottom:30px;
    font-size:2rem;
}

.card{
    background:var(--card);
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.experience{
    margin-bottom:25px;
    padding-bottom:25px;
    border-bottom:1px solid #e2e8f0;
}

.experience:last-child{
    border-bottom:none;
}

.experience h3{
    color:var(--accent);
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
}

.skill{
    background:#dbeafe;
    color:#1e40af;
    padding:10px 16px;
    border-radius:25px;
    font-weight:600;
}

.contact{
    text-align:center;
    background:white;
    border-radius:12px;
    padding:40px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.contact a{
    color:var(--accent);
    text-decoration:none;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    color:#64748b;
}

@media(max-width:768px){

.hero h1{
    font-size:2.2rem;
}

.hero h2{
    font-size:1.1rem;
}

}
</style>
</head>

<body>

<section
